name: Constitutional bootstrap validation
on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n constitution/*.sh government/*.sh tests/*.sh deploy/s6/viche/run
      - name: Check seat roster and constitutional model
        run: |
          grep -Fq 'opencode-go/longcat-2.5-preview-free' constitution/CONSTITUTION.md
          test -s government/seats.tsv
          awk -F '\t' 'NF != 3 || $1 !~ /^[0-9a-f]+$/ { exit 1 }' government/seats.tsv
          test "$(cut -f1 government/seats.tsv | sort -u | wc -l)" -eq "$(wc -l < government/seats.tsv)"
      - name: Exercise constitutional launch and recovery
        run: bash tests/boot-smoke.sh
      - name: Verify GPG Founder directives and replay prevention
        run: bash tests/signature-smoke.sh
