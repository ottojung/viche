name: Constitutional bootstrap validation
on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical ballots require the original seat roster history.
          fetch-depth: 0
      - name: Run all tests
        run: sh tests/run-all.sh
