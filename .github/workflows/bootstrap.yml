name: Constitutional bootstrap validation
on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          /bin/sh -n constitution/*.sh government/*.sh tests/*.sh deploy/s6/viche/run deploy/s6/viche-intake/run
          dash -n constitution/*.sh government/*.sh tests/*.sh deploy/s6/viche/run
      - name: Check seat roster and constitutional model
        run: |
          grep -Fq 'opencode-go/longcat-2.5-preview-free' constitution/CONSTITUTION.md
          test -s government/seats.tsv
          awk -F '\t' 'NF != 3 || $1 !~ /^[0-9a-f]+$/ { exit 1 }' government/seats.tsv
          test "$(cut -f1 government/seats.tsv | sort -u | wc -l)" -eq "$(wc -l < government/seats.tsv)"
      - name: Exercise constitutional launch and recovery
        run: dash tests/boot-smoke.sh
      - name: Exercise Clerk liveness recovery and cooldown
        run: dash tests/clerk-liveness-smoke.sh
      - name: Exercise parliamentary seat liveness recovery
        run: dash tests/seat-liveness-smoke.sh
      - name: Exercise targeted parliamentary summons
        run: dash tests/summons-smoke.sh
      - name: Check sampler TSV with zero agents
        run: dash tests/sample-metrics-smoke.sh
      - name: Exercise legislative tally
        run: dash tests/tally-smoke.sh
      - name: Exercise urgent Founder intake independently of sittings
        run: dash tests/intake-smoke.sh
      - name: Exercise Janitor Office observation and safe reclamation
        run: dash tests/janitor-smoke.sh
      - name: Check durable records carry no conflict markers
        run: dash tests/records-smoke.sh
      - name: Check durable ballots bind to their bills
        run: dash tests/ballot-integrity.sh
