name: Bootstrap validation
on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n government/boot.sh government/sitting.sh government/entrypoint.sh deploy/verify-founder.sh tests/boot-smoke.sh
      - name: Check constitutional model pin and seat count
        run: |
          grep -Fq 'opencode-go/longcat-2.5-preview-free' constitution/CONSTITUTION.md
          test "$(wc -l < government/seats.tsv)" -eq 10
          test "$(cut -f1 government/seats.tsv | sort -u | wc -l)" -eq 10
      - name: Bootstrap and restart rehearsal
        run: bash tests/boot-smoke.sh
