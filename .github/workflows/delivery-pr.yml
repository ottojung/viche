name: Viche delivery PR bridge
on:
  push:
    branches:
      - 'delivery/**'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: delivery-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Open a reviewable PR for the proposed delivery
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == delivery/* ]] || exit 2
          # A PR is a review request, not evidence of a passed law or merge.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$HEAD_BRANCH" --base main --json number --jq 'length')
          if [[ "$existing" != 0 ]]; then
            echo "Existing open PR for $HEAD_BRANCH"; exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f "title=Viche delivery: ${HEAD_BRANCH#delivery/}" \
            -f "head=$HEAD_BRANCH" -f "base=main" \
            -f "body=Unreviewed Viche delivery candidate. A PR never constitutes parliamentary enactment or an Act 21 quality gate pass. The Clerk (or authorized substitute) must verify the exact proposed merge commit and tree with the applicable local suite. For bills or ballots, verify the recorded vote and legal mandate independently. Do not merge from a green CI badge alone."
