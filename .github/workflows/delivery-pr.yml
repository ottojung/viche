name: Viche delivery PR bridge
# Runs from canonical main even when a historical seat branch lacks this file.
# Never executes code from the delivery branch with elevated permissions.
on:
  workflow_run:
    workflows:
      - Constitutional bootstrap validation
    types:
      - completed
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: delivery-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  propose:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          startsWith(github.event.workflow_run.head_branch, 'delivery/') &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Open a reviewable PR for the green delivery branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == delivery/* ]] || exit 2
          # PR creation is a review request, never approval to merge or enact.
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$HEAD_BRANCH" --base main --json number --jq 'length')
          if [[ "$existing" != 0 ]]; then
            echo "Existing PR for $HEAD_BRANCH"; exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f "title=Viche delivery: ${HEAD_BRANCH#delivery/}" \
            -f "head=$HEAD_BRANCH" -f "base=main" \
            -f "body=Unreviewed Viche delivery candidate with successful branch CI. A PR is not parliamentary enactment or an Act 21 local exact-commit verification. Clerk or an authorized substitute must verify the exact proposed merge commit and tree, with separate office review for Clerk-authored records. Bills/ballots additionally require recorded legal authority. Do not merge from CI alone."
