# Run from this directory: docker compose up -d --build
# No numeric concurrency, invocation, CPU or RAM admissions caps are imposed.
services:
  town:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp
    environment:
      VICHE_TOWN_ROOT: /town
      VICHE_SEATS_ROOT: /seats
      VICHE_CONSTITUTION: /constitution/CONSTITUTION.md
      VICHE_TOWNHALL_ID: ${VICHE_TOWNHALL_ID:?Create and configure a dedicated Antonina Town Hall issue}
      TZ: America/Vancouver
    volumes:
      # The writable working checkout is distinct from the founder's checkout.
      - ./data/town:/town:rw
      - ./data/seats:/seats:rw
      # This is the authoritative Founder-controlled, read-only constitutional copy.
      - ../constitution:/constitution:ro
      - ./data/state:/home/viche/.local/state:rw
      - ./data/cache:/home/viche/.cache:rw
      # Credentials stay out of Git and do not appear in the image.
      - ./private/config:/home/viche/.config:rw
      - ./private/share:/home/viche/.local/share:rw
      - ./private/ssh:/home/viche/.ssh:ro
      - ./private/gnupg:/home/viche/.gnupg:rw
      # Founder PUBLIC key and expected fingerprint only; private key stays off-host.
      - ./private/founder:/founder:ro
