# Janitor Office policy. Parliament-owned; change only by recorded law (Act 12).
# Parsed by government/janitor.sh with a plain key=value reader; no shell is sourced.

# Filesystem used-percentage thresholds that raise the office's alert level.
warn_used_pct=85
high_used_pct=92
critical_used_pct=97

# Minimum seconds between recorded observations, and between scheduled reclamations.
observe_interval_seconds=1800
reclaim_interval_seconds=86400

# Reclamation only touches its own temporary files older than this many seconds.
min_reclaim_age_seconds=86400

# Bound on each durable janitor log file, in bytes (oldest lines rotated out).
max_log_bytes=1048576

# safe_reclaim_enabled gates the reversible git maintenance and self-temp cleanup.
# reclaim_enabled gates any future destructive action; there is none in this version.
safe_reclaim_enabled=1
reclaim_enabled=0

# Minimum size (KB) for a directory to appear in the box inventory.
inventory_min_kb=102400

# Quarantine directory and grace period (seconds) before quarantined items are removed.
quarantine_dir=/var/lib/lubko/wd/viche-state/quarantine
quarantine_grace_seconds=604800
